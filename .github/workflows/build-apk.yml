name: Build Haier Lite TV APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed APK for Android TV 11
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify --print-certs --min-sdk-version 30 "$apk"
          badging=$("$build_tools/aapt" dump badging "$apk")
          grep -F "package: name='com.haierlite.tv'" <<< "$badging"
          grep -F "versionName='1.7'" <<< "$badging"
          grep -F "sdkVersion:'23'" <<< "$badging"
          native_entries=$(unzip -Z1 "$apk" | awk '/^lib\/.*[.]so$/')
          if [[ -n "$native_entries" ]]; then
            grep '^lib/armeabi-v7a/' <<< "$native_entries"
          fi
          grep -F "targetSdkVersion:'30'" <<< "$badging"
          grep -F "leanback-launchable-activity:" <<< "$badging"
          grep "^launchable-activity:" <<< "$badging"
          manifest=$("$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml)
          if grep -F 'android.intent.category.HOME' <<< "$manifest"; then
            echo "::error::Haier Lite TV must not register as a system HOME activity"
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaierLiteTV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture and test home screen on Android TV 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/check-tv-screen.sh
      - name: Upload Full HD screenshot
        uses: actions/upload-artifact@v4
        with:
          name: HaierLiteTV-Full-HD
          path: capture/home.png
          if-no-files-found: error
