name: Build Haier Lite TV APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed APK for Android TV 11
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify --min-sdk-version 30 "$apk"
          badging=$("$build_tools/aapt" dump badging "$apk")
          grep -F "package: name='com.haierlite.tv'" <<< "$badging"
          grep -F "targetSdkVersion:'30'" <<< "$badging"
          grep -F "leanback-launchable-activity:" <<< "$badging"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaierLiteTV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
